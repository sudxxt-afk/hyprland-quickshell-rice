# hyprlock — экран блокировки в стиле Catppuccin Mocha

general {
    hide_cursor = true
}

background {
    monitor     =
    path        = /home/kudensik/Pictures/Wallpapers/catppuccin-mocha.png
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.75
    vibrancy    = 0.2
}

# часы
label {
    monitor     =
    text        = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size   = 96
    color       = rgba(cdd6f4ff)
    position    = 0, 120
    halign      = center
    valign      = center
}

# дата
label {
    monitor     =
    text        = cmd[update:60000] date '+%A, %d %B'
    font_family = JetBrainsMono Nerd Font
    font_size   = 22
    color       = rgba(a6adc8ff)
    position    = 0, 30
    halign      = center
    valign      = center
}

# поле пароля
input-field {
    monitor           =
    size              = 300, 50
    outline_thickness = 2
    rounding          = 12
    dots_size         = 0.3
    dots_spacing      = 0.3
    outer_color       = rgba(cba6f7ff)
    inner_color       = rgba(181825cc)
    font_color        = rgba(cdd6f4ff)
    font_family       = JetBrainsMono Nerd Font
    placeholder_text  = <i>введи пароль...</i>
    fade_on_empty     = false
    fail_color        = rgba(f38ba8ff)
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color    = rgba(f9e2afff)
    check_color       = rgba(a6e3a1ff)
    position          = 0, -100
    halign            = center
    valign            = center
}
