# ═══════════════════════════════════════════════════════════════════════
#  theme.conf — цвета kitty, рендерится matugen из обоев.
#  Правки здесь затираются при следующей смене обоев.
#  Подключается из kitty.conf: include theme.conf
# ═══════════════════════════════════════════════════════════════════════

## Основа
foreground           #ececec
background           {{colors.surface.default.hex}}
selection_foreground {{colors.on_primary.default.hex}}
selection_background {{colors.primary.default.hex}}
cursor               {{colors.primary.default.hex}}

## 16 цветов терминала
# Не из палитры: это смысловые цвета (ошибки, git, ls), в монохромной схеме
# они все становились одинаково серыми. Приглушённые, но различимые на тёмном фоне.
color0  #3a3a3a
color8  #8a8a8a
color1  #f28b82
color9  #ff9e96
color2  #a8d5a2
color10 #bfe6b9
color3  #e6d28a
color11 #f2e2a6
color4  #9ab8e6
color12 #b4cbf0
color5  #c9a3e0
color13 #d9bdea
color6  #93d0d0
color14 #ade0e0
color7  #d0d0d0
color15 #ffffff

## Панель вкладок
tab_bar_background      {{colors.surface_container.default.hex}}
active_tab_foreground   {{colors.on_primary.default.hex}}
active_tab_background   {{colors.primary.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_container_high.default.hex}}

## Границы сплитов и скроллбар
active_border_color    {{colors.primary.default.hex}}
inactive_border_color  {{colors.outline_variant.default.hex}}
scrollbar_handle_color {{colors.outline.default.hex}}
