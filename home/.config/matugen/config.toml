[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/hyprland/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

# ── Мостики под мои приложения (добавлено поверх end-4) ──────────────
[templates.kitty]
input_path = '~/.config/matugen/templates/kitty/theme.conf'
output_path = '~/.config/kitty/theme.conf'

[templates.wofi]
input_path = '~/.config/matugen/templates/wofi/style.css'
output_path = '~/.config/wofi/style.css'

[templates.btop]
input_path = '~/.config/matugen/templates/btop/matugen.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch/config.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

[templates.starship]
input_path = '~/.config/matugen/templates/starship/starship.toml'
output_path = '~/.config/starship.toml'

# Тема VS Code: расширение ставится через `./rice vscode`, matugen перезаписывает его файл темы
[templates.vscode]
input_path = '~/.config/matugen/templates/vscode/matugen-dark.json'
output_path = '~/.vscode/extensions/rice.rice-matugen-1.0.0/themes/matugen-dark.json'

# Telegram: matugen пишет роли, rice-telegram-theme собирает из них .tdesktop-theme
[templates.telegram]
input_path = '~/.config/matugen/templates/telegram/palette.json'
output_path = '~/.local/state/rice/telegram-palette.json'
post_hook = '$HOME/.local/bin/rice-telegram-theme'
