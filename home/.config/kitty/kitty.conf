# kitty — терминал для rice (Hyprland + палитра matugen + Cozette + starship)

## Шрифт
font_family      family="CozetteVector" style="Medium"
bold_font        family="CozetteVectorBold" style="Medium"
italic_font      auto
bold_italic_font auto
font_size        13.0

# Nerd Font-иконки ( 󱄛 и т.д.) рисуем из JetBrainsMono Nerd Font
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+f0000-U+fffff,U+e0b0-U+e0bf JetBrainsMono Nerd Font

## Курсор со шлейфом
cursor_trail                3
cursor_trail_decay          0.1 0.4
cursor_trail_start_threshold 0

# Костюмер-шейдер (огненное свечение под курсором) выключен.
# Вернуть можно строкой: custom_shaders cursor-trail-blaze northern-lights

## Оформление
cursor_shape          beam
cursor_beam_thickness 1.5
background_opacity    0.85
# кровавая ASCII-тян проступает за текстом (faint-версия 45%, единство с обоями)
background_image      ~/Pictures/Wallpapers/ascii_blood_chan_faint.png
background_image_layout clamped
background_tint       0.0
# разрешает менять прозрачность на лету (kitty @ set-background-opacity ...)
dynamic_background_opacity yes
window_padding_width  14
hide_window_decorations yes
confirm_os_window_close 0

## Цвета — в ~/.config/kitty/theme.conf (генерирует matugen из обоев)

## Поведение
scrollback_lines 2000
enable_audio_bell no
copy_on_select yes

## Хоткеи (без Shift)
map ctrl+enter new_window_with_cwd
map ctrl+w     close_window
map ctrl+t     new_tab_with_cwd
map ctrl+q     close_tab

## Панель вкладок (powerline, Catppuccin Mocha)
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_margin_height   6 2
tab_bar_margin_width    6
tab_bar_min_tabs        2
tab_activity_symbol     ●

## Мелочи
resize_in_steps yes
# копирование выделения в буфер без доп. кликов (см. хоткей ниже)
map ctrl+alt+y pass_selection_to_program wl-copy

## Бордеры сплитов + приглушение неактивного окна
window_border_width    1
draw_minimal_borders   yes
dim_opacity            0.75

## Скроллбар (в 0.49 значения: scrolled/hovered/scrolled-and-hovered/scrolled-or-hovered/always/never)
scrollbar scrolled
scrollbar_width 0.5
scrollbar_handle_opacity 0.9

## Wayland (GNOME + Hyprland)
linux_display_server wayland

## Полезняшки
# Уведомление (mako), когда долгоиграющая (>10 c) команда завершилась в неактивном табе
notify_on_cmd_finish   invisible 10.0

# Убрать 🔔 на вкладке, оставить только ● от tab_activity_symbol
bell_on_tab            ""

# Управление kitty из скриптов и из других терминалов: kitty @ ...
allow_remote_control   socket-only
listen_on              unix:@kitty-{kitty_pid}

## Чёткость пиксельного Cozette (старый композитинг, текст плотнее)
text_composition_strategy legacy

## Цвета (файл генерирует matugen из обоев)
include theme.conf
