# ═══════════════════════════════════════════════════════════════════════
#  palette.toml — единственный источник цвета для всего риса
#
#  Меняете здесь — `python3 theme/render.py` — меняется везде:
#  терминал, лаунчер, бар и дропдауны Wayle, виджеты, GTK, btop, cava,
#  starship, fastfetch, цвета границ композитора.
#
#  Проверка, что нигде не осталось посторонних цветов: ./theme/check.sh
# ═══════════════════════════════════════════════════════════════════════

[palette]
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"
surface0  = "#313244"
surface1  = "#45475a"
surface2  = "#585b70"
overlay0  = "#6c7086"
overlay1  = "#7f849c"
overlay2  = "#9399b2"
subtext0  = "#a6adc8"
subtext1  = "#bac2de"
text      = "#cdd6f4"
lavender  = "#b4befe"
blue      = "#89b4fa"
sapphire  = "#74c7ec"
sky       = "#89dceb"
teal      = "#94e2d5"
green     = "#a6e3a1"
yellow    = "#f9e2af"
peach     = "#fab387"
maroon    = "#eba0ac"
red       = "#f38ba8"
mauve     = "#cba6f7"
pink      = "#f5c2e7"
flamingo  = "#f2cdcd"
rosewater = "#f5e0dc"

[fonts]
ui        = "JetBrains Mono"
ui_size   = "11"
mono      = "JetBrains Mono"
terminal  = "CozetteVector"
terminal_size = "13"

[geometry]
margin      = "16"
radius      = "16"
card_height = "96"
dock_height = "68"
cava_height = "68"
screen_w    = "1920"
screen_h    = "1080"
