# ═══════════════════════════════════════════════════════════════════
#  cava-raw.conf — cava для виджета-эквалайзера
#
#  Обычный cava рисует в терминале; здесь он отдаёт значения полосок
#  текстом в stdout, а рисует их уже Quickshell.
#  Формат строки:  12;48;91;30;...   (значения 0..100, разделитель «;»)
#  Запуск: cava -p ~/rice/quickshell/widgets/cava-raw.conf
# ═══════════════════════════════════════════════════════════════════

[general]
framerate = 60              # кадров в секунду; 60 — плавно, 30 — экономнее
bars = 24                   # сколько полосок
autosens = 1                # автоматическая чувствительность
sensitivity = 100
lower_cutoff_freq = 60      # ниже — басы
higher_cutoff_freq = 12000  # выше — верхние частоты

[input]
# В сборке Fedora cava без поддержки pipewire, поэтому берём pulse —
# на этой системе за ним стоит PipeWire через pipewire-pulse, звук тот же.
method = pulse
# ВАЖНО: здесь НЕ auto. На этой машине источник по умолчанию — микрофон,
# и cava с auto показывал ровную тишину. @DEFAULT_MONITOR@ — это монитор
# устройства вывода по умолчанию, то есть ровно то, что слышно в колонках.
source = @DEFAULT_MONITOR@

[output]
method = raw                # не рисуем в терминале, а отдаём значения
raw_target = /dev/stdout    # ...в стандартный вывод
data_format = ascii         # текстом, а не бинарно
ascii_max_range = 100       # значения от 0 до 100
bar_delimiter = 59          # 59 = символ «;» между полосками
channels = mono             # одна дорожка спектра
